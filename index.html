<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mein Glossar App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Mein Glossar</h1>
        <p>Begriffe einfach erklärt</p>
    </header>

    <main>

        <input
            type="text"
            id="suche"
            placeholder="Begriff suchen..."
        >
<label for="kategorieFilter">Nach Kategorie filtern:</label>
<input
  type="text"
  id="kategorieSuche"
  placeholder="Kategorie suchen..."
>
<select id="kategorieFilter">
  <option value="">Alle Kategorien</option>
  <option value="Allgemein">Allgemein</option>
  <option value="Informatik">Informatik</option>
  <option value="Wirtschaft">Wirtschaft</option>
  <option value="Mathematik">Mathematik</option>
  <option value="Naturwissenschaften">Naturwissenschaften</option>
  <option value="Physik">Physik</option>
  <option value="Chemie">Chemie</option>
  <option value="Biologie">Biologie</option>
  <option value="Geschichte">Geschichte</option>
  <option value="Geografie">Geografie</option>
  <option value="Politik">Politik</option>
  <option value="Deutsch">Deutsch</option>
  <option value="Englisch">Englisch</option>
  <option value="Technik">Technik</option>
  <option value="Medizin">Medizin</option>
  <option value="Recht">Recht</option>
  <option value="Psychologie">Psychologie</option>
  <option value="Philosophie">Philosophie</option>
  <option value="Kunst">Kunst</option>
  <option value="Musik">Musik</option>
  <option value="Sport">Sport</option>
  <option value="Sonstiges">Sonstiges</option>
</select>
      <div id="glossar"></div>

<h2>Neuen Begriff hinzufügen</h2>

<form id="begriffForm">

  <input
    type="text"
    id="neuerBegriff"
    placeholder="Begriff eingeben"
    required
  >

  <label for="neueKategorie">Kategorie auswählen:</label>

  <select id="neueKategorie" required>
    <option value="">Bitte auswählen</option>
    <option value="Allgemein">Allgemein</option>
    <option value="Informatik">Informatik</option>
    <option value="Wirtschaft">Wirtschaft</option>
    <option value="Mathematik">Mathematik</option>
    <option value="Naturwissenschaften">Naturwissenschaften</option>
    <option value="Physik">Physik</option>
    <option value="Chemie">Chemie</option>
    <option value="Biologie">Biologie</option>
    <option value="Geschichte">Geschichte</option>
    <option value="Geografie">Geografie</option>
    <option value="Politik">Politik</option>
    <option value="Deutsch">Deutsch</option>
    <option value="Englisch">Englisch</option>
    <option value="Technik">Technik</option>
    <option value="Medizin">Medizin</option>
    <option value="Recht">Recht</option>
    <option value="Psychologie">Psychologie</option>
    <option value="Philosophie">Philosophie</option>
    <option value="Kunst">Kunst</option>
    <option value="Musik">Musik</option>
    <option value="Sport">Sport</option>
    <option value="Sonstiges">Sonstiges</option>
  </select>

  <textarea
    id="neueErklaerung"
    placeholder="Erklärung eingeben"
    required
  ></textarea>

  <button type="submit">
    Begriff speichern
  </button>

</form>

<p id="meldung"></p>
    </main>

    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mein Glossar App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Mein Glossar</h1>
        <p>Begriffe einfach erklärt</p>
    </header>

    <main>

        <input
            type="text"
            id="suche"
            placeholder="Begriff suchen..."
        >

        <div id="glossar"></div>
<h2>Neuen Begriff hinzufügen</h2>

<form id="begriffForm">

  <input
    type="text"
    id="neuerBegriff"
    placeholder="Begriff eingeben"
    required
  >

  <textarea
    id="neueErklaerung"
    placeholder="Erklärung eingeben"
    required
  ></textarea>

  <button type="submit">
    Begriff speichern
  </button>

</form>

<p id="meldung"></p>
    </main>

    <script src="script.js"></script>

</body>
</html>
